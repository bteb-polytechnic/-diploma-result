<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTEB Results Zone | Diploma in Engineering Result</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Check BTEB Polytechnic Diploma in Engineering Semester-wise Results, GPA, and Referred Subjects.">
    <meta name="keywords" content="bteb results zone, diploma result, polytechnic result, bteb result, 7th semester result">

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        .main-container { width: 100%; max-width: 480px; }
        
        /* Top App Bar */
        .app-bar { background: #ffffff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #006a4e; }
        .app-bar h2 { color: #006a4e; font-size: 20px; font-weight: 700; }
        .app-bar span { font-size: 13px; color: #666; background: #e8f5e9; padding: 3px 10px; border-radius: 15px; font-weight: 600; }

        /* Search Box */
        .search-card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; }
        .search-card input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; outline: none; text-align: center; font-weight: 700; margin-bottom: 12px; }
        .search-card input:focus { border-color: #006a4e; }
        .btn-search { width: 100%; background: #006a4e; color: #fff; border: none; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-search:hover { background: #004d38; }

        #statusBanner { background: #fff8e1; color: #856404; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba; font-weight: 600; }

        /* Result View Area */
        #resultArea { display: none; }
        
        .student-info-card { background: #ffffff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center; border-top: 4px solid #17a2b8; }
        .student-info-card h3 { font-size: 22px; color: #333; margin-bottom: 5px; }
        .student-info-card p { font-size: 13px; color: #666; }

        /* Semester Card Style (Like Reference Image) */
        .semester-card { background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; overflow: hidden; border: 1px solid #eaeaea; }
        .semester-header { padding: 14px 16px; background: #fdfdfd; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .semester-title { font-size: 16px; font-weight: 700; color: #333; }
        
        .badge-pass { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-fail { background: #ffebee; color: #c62828; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }

        .gpa-box-large { margin: 12px 16px; background: #e8f5e9; padding: 12px; border-radius: 8px; text-align: center; }
        .gpa-box-large span { font-size: 12px; color: #2e7d32; display: block; }
        .gpa-box-large strong { font-size: 24px; color: #2e7d32; }

        .subject-list { padding: 12px 16px; }
        .subject-item { background: #fafafa; border: 1px solid #eee; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .subject-item span { color: #c62828; font-weight: 600; }

        .error-box { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; text-align: center; font-weight: 650; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; text-align: center; }

        @media print { .search-card, .btn-search, #statusBanner, .footer { display: none; } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="app-bar">
        <h2>BTEB Results Zone</h2>
        <span>Diploma</span>
    </div>

    <div class="search-card">
        <div id="statusBanner">⏳ ডাটাবেز লোড হচ্ছে...</div>
        <input type="number" id="rollInput" placeholder="রোল নম্বর লিখুন (যেমন: 101882)" onkeypress="if(event.key==='Enter') searchResult()">
        <button class="btn-search" id="searchBtn" onclick="searchResult()">ফলাফল খুঁজুন</button>
    </div>

    <div id="resultArea">
        <div class="student-info-card">
            <h3 id="resRoll"># ------</h3>
            <p>Diploma in Engineering • Regulation 2016</p>
        </div>
        <div id="semesterContainer"></div>
    </div>
</div>

<div class="footer">&copy; BTEB Results Zone BD | সর্বস্বত্ব সংরক্ষিত</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    const PDF_URL = 'RESULT_7th_2016_Regulation.pdf';

    // ডেমো ডাটা
    const demoDatabase = {
        "101882": { gpa7: "3.27", gpa6: "3.51", gpa5: "3.11", gpa4: "3.09", ref_sub: "" },
        "101171": { gpa7: "ref", gpa6: "3.46", gpa5: "3.41", gpa4: "3.30", ref_sub: "66771(T), 66773(T)" },
        "500897": { gpa7: "ref", gpa6: "2.69", gpa5: "2.59", gpa4: "2.67", ref_sub: "65853(T)" }
    };

    async function initPDF() {
        const banner = document.getElementById('statusBanner');
        try {
            pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
            banner.style.background = '#e8f5e9';
            banner.style.color = '#006a4e';
            banner.innerHTML = `✅ ২৮৩ পৃষ্ঠার সম্পূর্ণ রেজাল্ট ডাটাবেজ যুক্ত আছে!`;
        } catch (err) {
            banner.innerHTML = `⚠️ গিটহাবে <b>RESULT_7th_2016_Regulation.pdf</b> ফাইলটি আপলোড করুন। (ডেমো রোল: 101882, 101171)`;
        }
    }
    initPDF();

    async function searchResult() {
        const roll = document.getElementById("rollInput").value.trim();
        const area = document.getElementById("resultArea");
        const btn = document.getElementById("searchBtn");
        
        if (!roll || roll.length < 5) {
            alert("দয়া করে সঠিক বোর্ড রোল নম্বর লিখুন!");
            return;
        }

        let studentData = demoDatabase[roll];

        if (!studentData && pdfDoc) {
            btn.disabled = true;
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                btn.innerText = `খোঁজা হচ্ছে... (${i}/${pdfDoc.numPages})`;
                const page = await pdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');

                if (pageText.includes(roll)) {
                    const regex = new RegExp(roll + "\\s*[\\(\\{]([^\\)\\}]+)[\\)\\}]");
                    const match = pageText.match(regex);
                    if (match) {
                        const clean = match[1].replace(/\s+/g, ' ').trim();
                        const gpa7 = (clean.match(/gpa7:\s*([0-9.]+|ref)/i) || [null, "-"])[1];
                        const gpa6 = (clean.match(/gpa6:\s*([0-9.]+|ref)/i) || [null, "-"])[1];
